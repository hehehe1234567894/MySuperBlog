{{/* 群集光标舞台：覆盖在页面之上的 canvas 层 */}}
<div class="swarm-stage" id="swarmStage" aria-hidden="true">
  <canvas id="swarmCanvas"></canvas>
  <div class="swarm-hud" id="swarmHud">
    <span class="hud-dot"></span>
    <span class="hud-text"><b id="hudAgents">0</b> agents<span class="hud-sep"></span><b id="hudLayers">0</b> layers</span>
    <button class="hud-skip" id="hudSkip" type="button">跳过</button>
    <button class="hud-replay" id="hudReplay" type="button">↻ 重播</button>
    <span class="hud-hint" id="hudHint">↓ 滚动继续建造</span>
  </div>
</div>

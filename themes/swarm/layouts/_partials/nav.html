<header class="site-nav" id="siteNav">
  <a class="brand" href="{{ site.Home.RelPermalink }}">
    <span class="brand-mark" aria-hidden="true"></span>
    <span class="brand-text">{{ site.Title }}</span>
  </a>
  <nav class="nav-links" aria-label="主导航">
    <a href="{{ site.Home.RelPermalink }}">首页</a>
    {{ with site.GetPage "/posts" }}<a href="{{ .RelPermalink }}">文章</a>{{ end }}
    {{ with site.GetPage "/series" }}<a href="{{ .RelPermalink }}">合集</a>{{ end }}
    {{ with site.GetPage "/tags" }}<a href="{{ .RelPermalink }}">标签</a>{{ end }}
  </nav>
  <button class="nav-toggle" id="navToggle" aria-label="切换导航" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
</header>

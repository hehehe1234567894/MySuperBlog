<!DOCTYPE html>
<html lang="{{ site.Language.Lang | default "zh-cn" }}">
<head>
  {{ partial "head.html" . }}
</head>
<body class="{{ if .IsHome }}is-home{{ else }}is-page{{ end }}">
  {{ partial "swarm-canvas.html" . }}
  <div class="page-wrap" id="pageWrap">
    {{ partial "nav.html" . }}
    <main class="site-main">
      {{ block "main" . }}{{ end }}
    </main>
    {{ partial "footer.html" . }}
  </div>
  {{ partial "scripts.html" . }}
</body>
</html>
